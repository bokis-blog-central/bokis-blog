services:
  - type: web
    name: bokis-blog
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
    disk:
      name: bokis-blog-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SIGNUP_PASSWORD
        sync: false
      - key: BLOG_HTTPS
        value: "1"
      - key: BLOG_DATA_DIR
        value: /opt/render/project/src/instance
